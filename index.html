<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dutching Pro - Exact Score</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #090d16 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent-target: #f59e0b;
            --accent-support: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --shadow-3d: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            --inner-glow: inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: var(--shadow-3d), var(--inner-glow);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 4px;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            color: var(--text-main);
            font-size: 0.95krem;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2), inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            margin-top: 8px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        button:active {
            transform: translateY(1px);
        }

        #resultado {
            margin-top: 24px;
            display: none;
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .match-header {
            background: rgba(15, 23, 42, 0.4);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 16px;
            border: 1px solid var(--card-border);
            text-align: center;
        }

        .match-title {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 4px;
        }

        .league-name {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .stat-card {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        .stat-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .stat-value {
            font-size: 0.95rem;
            font-weight: 700;
        }

        .alert-box {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 16px;
            text-align: center;
        }

        .alert-good {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
        }

        .alert-bad {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
        }

        .placar-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 12px 16px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s;
        }

        .placar-card:hover {
            transform: scale(1.02);
        }

        /* Efeito 3D especial para o Alvo Principal */
        .placar-card.alvo-principal {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.15) 0%, rgba(15, 23, 42, 0.8) 100%);
            border: 1px solid rgba(245, 158, 11, 0.4);
            box-shadow: 0 6px 15px rgba(245, 158, 11, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .placar-info .score {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .placar-info .desc {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .placar-odds {
            text-align: right;
        }

        .placar-odds .odd {
            font-size: 1rem;
            font-weight: 700;
            color: #818cf8;
        }

        .placar-odds .prob {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .loading {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 16px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Dutching Pro</h1>
        <p class="subtitle">Análise Estatística & Alvo Exato</p>

        <div class="input-group">
            <label for="home">Equipe da Casa</label>
            <input type="text" id="home" placeholder="Ex: Real Madrid">
        </div>

        <div class="input-group">
            <label for="away">Equipe Visitante</label>
            <input type="text" id="away" placeholder="Ex: Barcelona">
        </div>

        <button onclick="analisarPartida()">Analisar Confronto</button>

        <div id="loading" class="loading">A processar dados e calcular Poisson...</div>

        <div id="resultado">
            <div class="match-header">
                <div class="league-name" id="res-liga">-</div>
                <div class="match-title" id="res-partida">-</div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">xG Casa</div>
                    <div class="stat-value" id="res-xg-casa">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">xG Fora</div>
                    <div class="stat-value" id="res-xg-fora">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Linha de Gols</div>
                    <div class="stat-value" id="res-linha" style="font-size: 0.8rem;">-</div>
                </div>
            </div>

            <div id="res-alerta" class="alert-box">-</div>

            <div id="lista-placares">
                <!-- Os placares gerados entram aqui -->
            </div>
        </div>
    </div>

    <script>
        async function analisarPartida() {
            const home = document.getElementById('home').value.trim();
            const away = document.getElementById('away').value.trim();
            const btnCarregando = document.getElementById('loading');
            const divResultado = document.getElementById('resultado');

            if (!home || !away) {
                alert('Por favor, preencha os nomes das duas equipas.');
                return;
            }

            btnCarregando.style.display = 'block';
            divResultado.style.display = 'none';

            // URL DA SUA API NO RENDER (substitua se o seu link for diferente)
            const apiUrl = `https://cs-dutching-api.onrender.com/analisar?home=${encodeURIComponent(home)}&away=${encodeURIComponent(away)}`;

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                document.getElementById('res-liga').innerText = data.campeonato;
                document.getElementById('res-partida').innerText = data.partida;
                document.getElementById('res-xg-casa').innerText = data.xg_casa;
                document.getElementById('res-xg-fora').innerText = data.xg_fora;
                document.getElementById('res-linha').innerText = data.linha_gols;

                const caixaAlerta = document.getElementById('res-alerta');
                caixaAlerta.innerText = data.alerta_volatilidade;
                if (data.cobertura >= 55.0) {
                    caixaAlerta.className = "alert-box alert-good";
                } else {
                    caixaAlerta.className = "alert-box alert-bad";
                }

                let htmlPlacares = '';
                data.top_5.forEach((p, index) => {
                    const isAlvo = index === 0;
                    const classeCard = isAlvo ? "placar-card alvo-principal" : "placar-card";
                    const probabilidadePct = (p.probabilidade * 100).toFixed(1) + '%';

                    htmlPlacares += `
                        <div class="${classeCard}">
                            <div class="placar-info">
                                <div class="score">${p.placar}</div>
                                <div class="desc">${p.descricao}</div>
                            </div>
                            <div class="placar-odds">
                                <div class="odd">@${p.odd_estimada}</div>
                                <div class="prob">${probabilidadePct}</div>
                            </div>
                        </div>
                    `;
                });

                document.getElementById('lista-placares').innerHTML = htmlPlacares;
                divResultado.style.display = 'block';
            } catch (error) {
                alert('Erro ao conectar com a API no Render. Verifique se o servidor está ativo.');
                console.error(error);
            } finally {
                btnCarregando.style.display = 'none';
            }
        }
    </script>
</body>
</html>

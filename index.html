<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS-Dutching | Análise de Placar Exato</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --text-muted: #666666;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --border-color: #e2e8f0;
            --input-bg: #f8fafc;
            --table-header: #f1f5f9;
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --border-color: #334155;
            --input-bg: #0f172a;
            --table-header: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 12px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
        }

        button.btn-analisar {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
        }

        button.btn-analisar:hover {
            background-color: var(--primary-hover);
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            display: none;
        }

        .results {
            display: none;
        }

        .match-title {
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 4px;
        }

        .championship-name {
            font-size: 0.9rem;
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .metric-box {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }

        .metric-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .metric-value {
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 4px;
        }

        .alert-box {
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .alert-warning {
            background-color: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .alert-success {
            background-color: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .alert-neutral {
            background-color: rgba(59, 130, 246, 0.1);
            color: var(--primary);
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: var(--table-header);
            font-weight: 600;
        }
    </style>
</head>
<body data-theme="dark">
    <div class="container">
        <header>
            <h1>CS-Dutching ⚽</h1>
            <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">☀️</button>
        </header>

        <div class="card">
            <div class="form-group">
                <label for="home">Equipe da Casa</label>
                <input type="text" id="home" list="teams-list" placeholder="Ex: Flamengo">
            </div>
            <div class="form-group">
                <label for="away">Equipe Visitante</label>
                <input type="text" id="away" list="teams-list" placeholder="Ex: Palmeiras">
            </div>
            <datalist id="teams-list">
                <option value="Arsenal">
                <option value="Manchester City">
                <option value="Real Madrid">
                <option value="Barcelona">
                <option value="Flamengo">
                <option value="Palmeiras">
                <option value="Botafogo">
                <option value="River Plate">
                <option value="Boca Juniors">
            </datalist>
            <button class="btn-analisar" onclick="analisarPartida()">Analisar Partida</button>
        </div>

        <div class="loading" id="loading">Consultando dados reais na API e calculando Poisson... ⏳</div>

        <div class="card results" id="results-card">
            <div class="match-title" id="res-match"></div>
            <div class="championship-name" id="res-championship"></div>
            
            <div class="alert-box" id="res-volatility"></div>

            <div class="metrics-grid">
                <div class="metric-box">
                    <div class="metric-label">xG Esperado</div>
                    <div class="metric-value" id="res-xg"></div>
                </div>
                <div class="metric-box">
                    <div class="metric-label">Linha de Gols</div>
                    <div class="metric-value" id="res-goals"></div>
                </div>
                <div class="metric-box">
                    <div class="metric-label">Cobertura Top 5</div>
                    <div class="metric-value" id="res-coverage"></div>
                </div>
                <div class="metric-box">
                    <div class="metric-label">Soma Implícita</div>
                    <div class="metric-value" id="res-implied"></div>
                </div>
            </div>

            <h3 style="font-size: 1rem; margin-bottom: 8px;">Top 5 Placares (Dutching)</h3>
            <table>
                <thead>
                    <tr>
                        <th>Placar</th>
                        <th>Descrição</th>
                        <th>Odd Est.</th>
                    </tr>
                </thead>
                <tbody id="res-table-body">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = "https://cs-dutching-api.onrender.com";

        // Gerenciamento de Tema
        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.getAttribute("data-theme");
            const newTheme = currentTheme === "dark" ? "light" : "dark";
            body.setAttribute("data-theme", newTheme);
            document.getElementById("theme-btn").innerText = newTheme === "dark" ? "☀️" : "🌙";
            localStorage.setItem("theme", newTheme);
        }

        window.addEventListener("DOMContentLoaded", () => {
            const savedTheme = localStorage.getItem("theme") || "dark";
            document.body.setAttribute("data-theme", savedTheme);
            document.getElementById("theme-btn").innerText = savedTheme === "dark" ? "☀️" : "🌙";
        });

        async function analisarPartida() {
            const home = document.getElementById("home").value.trim();
            const away = document.getElementById("away").value.trim();

            if (!home || !away) {
                alert("Por favor, preencha os nomes das duas equipes.");
                return;
            }

            document.getElementById("loading").style.display = "block";
            document.getElementById("results-card").style.display = "none";

            try {
                const response = await fetch(`${API_URL}/analisar?home=${encodeURIComponent(home)}&away=${encodeURIComponent(away)}`);
                const data = await response.json();

                if (response.ok) {
                    document.getElementById("res-match").innerText = data.partida;
                    document.getElementById("res-championship").innerText = "🏆 " + (data.campeonato || "Competição Geral");
                    document.getElementById("res-xg").innerText = `${data.xg_casa} - ${data.xg_fora}`;
                    document.getElementById("res-goals").innerText = data.linha_gols;
                    document.getElementById("res-coverage").innerText = `${data.cobertura}%`;
                    document.getElementById("res-implied").innerText = data.soma_implicita;

                    // Alerta de volatilidade
                    const alertBox = document.getElementById("res-volatility");
                    alertBox.innerText = data.alerta_volatilidade;
                    alertBox.className = "alert-box " + (data.cobertura < 40 ? "alert-warning" : (data.cobertura >= 55 ? "alert-success" : "alert-neutral"));

                    // Tabela Top 5
                    const tbody = document.getElementById("res-table-body");
                    tbody.innerHTML = "";
                    data.top_5.forEach(item => {
                        const tr = document.createElement("tr");
                        tr.innerHTML = `
                            <td><strong>${item.placar}</strong></td>
                            <td>${item.descricao}</td>
                            <td>${item.odd_estimada}</td>
                        `;
                        tbody.appendChild(tr);
                    });

                    document.getElementById("results-card").style.display = "block";
                } else {
                    alert("Erro ao processar a análise no servidor.");
                }
            } catch (error) {
                console.error(error);
                alert("Erro de conexão com a API no Render.");
            } finally {
                document.getElementById("loading").style.display = "none";
            }
        }
    </script>
</body>
</html>
